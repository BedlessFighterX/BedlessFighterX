  <text x="104" y="205" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" letter-spacing="1.1">JAVA  •  MINECRAFT SERVER DEVELOPMENT  •  AUTOMATION</text>
  <rect x="103" y="229" width="228" height="31" rx="15.5" fill="#0B2238" stroke="#22D3EE" stroke-opacity="0.45"/>
