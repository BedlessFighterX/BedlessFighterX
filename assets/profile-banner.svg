<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Iliya Alizadeh Moghadam — Developer</title>
  <desc id="desc">A dark navy developer banner with cyan and blue accents, a terminal panel, and a Java and Minecraft server development tagline.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
